name: Deploy Blazor to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish umount.csproj -c Release -o release

      # GitHub Pages 라우팅 및 404 오류 방지 처리
      - name: Add .nojekyll & SPA 404 handling
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      # 커스텀 도메인(wwwroot/CNAME)이 없으면 https://<owner>.github.io/<repo>/ 로 서비스되므로 base href를 저장소 이름으로 변경
      - name: Rewrite base href
        if: hashFiles('wwwroot/CNAME') == ''
        run: |
          REPOSITORY_NAME=$(echo '${{ github.repository }}' | awk -F'/' '{print $2}')
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPOSITORY_NAME/\" />|g" release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
